name: Hayat Tounes Android RC

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'raw_source_packs/**'
      - '.github/workflows/hayat-tounes-android-xz.yml'

permissions:
  contents: read

concurrency:
  group: hayat-tounes-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-rc:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GODOT_VERSION: '4.7.2'
      GODOT_CHANNEL: 'stable'
      ANDROID_HOME: ${{ github.workspace }}/.android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/.android-sdk
      APK_PATH: ${{ github.workspace }}/_project/build/android/hayat-tounes-v0.53.30-debug.apk

    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct source from reviewed JSONL packs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          source = Path('raw_source_packs')
          out = Path('_project')
          packs = sorted(source.glob('pack-*.jsonl'))
          if len(packs) != 18:
              raise SystemExit(f'EXPECTED_18_PACKS_FOUND_{len(packs)}')

          chunks = {}
          for pack in packs:
              for lineno, raw in enumerate(pack.read_text(encoding='utf-8').splitlines(), 1):
                  if not raw.strip():
                      continue
                  row = json.loads(raw)
                  rel = str(row['path'])
                  idx = int(row['index'])
                  if rel.startswith('/') or '..' in Path(rel).parts:
                      raise SystemExit(f'UNSAFE_PATH:{rel}')
                  chunks.setdefault(rel, {})[idx] = str(row['content'])

          for rel, parts in chunks.items():
              indexes = sorted(parts)
              if indexes != list(range(len(indexes))):
                  raise SystemExit(f'NON_CONTIGUOUS:{rel}:{indexes}')
              target = out / rel
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(''.join(parts[i] for i in indexes), encoding='utf-8')

          required = [
              'project.godot', 'export_presets.cfg', 'main_production.tscn',
              'RELEASE_METADATA.json',
              'autoload/GameState.gd', 'autoload/SaveService.gd',
              'autoload/RuntimeDiagnostics.gd', 'autoload/SettingsService.gd',
              'autoload/SessionGuard.gd', 'scripts/core/ProductionWorld.gd'
          ]
          missing = [p for p in required if not (out / p).is_file()]
          if missing:
              raise SystemExit('MISSING_REQUIRED:' + ','.join(missing))

          gd = list(out.rglob('*.gd'))
          if len(gd) < 40:
              raise SystemExit(f'INSUFFICIENT_GDSCRIPT_COUNT:{len(gd)}')
          print(f'RECONSTRUCT_PASS packs={len(packs)} files={len(chunks)} gdscript={len(gd)}')
          PY
          grep -F 'config/version="0.53.30"' _project/project.godot
          grep -F 'version/code=83' _project/export_presets.cfg
          grep -F 'package/unique_name="com.amir.hayattounes"' _project/export_presets.cfg

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install exact Android dependencies
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'build-tools;35.0.1' 'platforms;android-35' 'cmake;3.10.2.4988404' 'ndk;28.1.13356709'
          test -x "$ANDROID_HOME/build-tools/35.0.1/apksigner"
          test -x "$ANDROID_HOME/build-tools/35.0.1/zipalign"

      - name: Install exact Godot 4.7.2 and export templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .godot-bin /tmp/godot-templates
          curl -fL --retry 3 "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-${GODOT_CHANNEL}/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64.zip" -o /tmp/godot.zip
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot.zip' | sha256sum -c -
          unzip -q /tmp/godot.zip -d .godot-bin
          GODOT_BIN="$GITHUB_WORKSPACE/.godot-bin/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          "$GODOT_BIN" --version | tee /tmp/godot-version.txt
          grep -F '4.7.2' /tmp/godot-version.txt

          curl -fL --retry 3 "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-${GODOT_CHANNEL}/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_export_templates.tpz" -o /tmp/templates.tpz
          echo 'f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011  /tmp/templates.tpz' | sha256sum -c -
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_CHANNEL}"
          mkdir -p "$TEMPLATE_DIR"
          cp -a /tmp/godot-templates/templates/. "$TEMPLATE_DIR/"
          test -s "$TEMPLATE_DIR/android_debug.apk"
          test -s "$TEMPLATE_DIR/android_release.apk"

      - name: Godot import and parser gate
        shell: bash
        run: |
          set -euo pipefail
          cd _project
          "$GODOT_BIN" --headless --editor --path . --quit-after 2 2>&1 | tee ../godot-import.log
          ! grep -E 'SCRIPT ERROR:|Parse Error:|Failed to load script|Node not found:' ../godot-import.log

      - name: Runtime smoke on production main scene
        shell: bash
        run: |
          set -euo pipefail
          cd _project
          "$GODOT_BIN" --headless --path . --quit-after 300 2>&1 | tee ../godot-runtime.log
          ! grep -E 'SCRIPT ERROR:|Parse Error:|Failed to load script|Invalid access|Invalid assignment|Node not found:' ../godot-runtime.log
          grep -F 'Godot Engine v4.7.2' ../godot-runtime.log || true

      - name: Export Android debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd _project
          mkdir -p build/android
          "$GODOT_BIN" --headless --path . --export-debug 'Android Development' 'build/android/hayat-tounes-v0.53.30-debug.apk' 2>&1 | tee ../godot-export.log
          ! grep -E 'SCRIPT ERROR:|Parse Error:|Failed to load script|ERROR:.*export' ../godot-export.log
          test -s build/android/hayat-tounes-v0.53.30-debug.apk
          test "$(stat -c%s build/android/hayat-tounes-v0.53.30-debug.apk)" -gt 1000000

      - name: Verify APK package signature alignment and hash
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify --verbose --print-certs "$APK_PATH" | tee apk-signature.txt
          "$ANDROID_HOME/build-tools/35.0.1/zipalign" -c -P 16 -v 4 "$APK_PATH" | tee apk-zipalign.txt
          sha256sum "$APK_PATH" | tee hayat-tounes-v0.53.30-debug.apk.sha256
          ls -lh "$APK_PATH"

      - name: Upload verified APK and runtime evidence
        uses: actions/upload-artifact@v4
        with:
          name: hayat-tounes-v0.53.30-android-debug
          if-no-files-found: error
          retention-days: 14
          path: |
            _project/build/android/hayat-tounes-v0.53.30-debug.apk
            hayat-tounes-v0.53.30-debug.apk.sha256
            apk-signature.txt
            apk-zipalign.txt
            godot-import.log
            godot-runtime.log
            godot-export.log
