name: Android Device Acceptance Harness

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'tools/android/device_acceptance.py'
      - 'tools/android/verify_device_acceptance.py'
      - 'tools/tests/test_device_acceptance_harness.py'
      - '.github/workflows/android-device-acceptance-harness.yml'

permissions:
  contents: read

jobs:
  harness-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax gate
        run: python3 -m py_compile tools/android/device_acceptance.py tools/android/verify_device_acceptance.py tools/tests/test_device_acceptance_harness.py
      - name: Fake-device acceptance and tamper-detection contract
        run: python3 tools/tests/test_device_acceptance_harness.py
